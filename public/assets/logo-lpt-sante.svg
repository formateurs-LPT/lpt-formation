<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Green circle -->
  <circle cx="100" cy="100" r="96" fill="#4db85c"/>
  <!-- White geometric snowflake pattern -->
  <!-- 4 rounded rectangles at 0, 90, 180, 270 deg -->
  <g fill="white" transform="translate(100,100)">
    <!-- horizontal bar -->
    <rect x="-38" y="-16" width="76" height="32" rx="8"/>
    <!-- vertical bar -->
    <rect x="-16" y="-38" width="32" height="76" rx="8"/>
    <!-- diagonal 1 -->
    <rect x="-38" y="-16" width="76" height="32" rx="8" transform="rotate(45)"/>
    <!-- diagonal 2 -->
    <rect x="-38" y="-16" width="76" height="32" rx="8" transform="rotate(-45)"/>
    <!-- center overlap cover to create the cutout look -->
    <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#4db85c"/>
    <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#4db85c" transform="rotate(45)"/>
  </g>
</svg>
